name: DAILY OS regression
on:
  push:
    branches: [main, v1.3, v1.3-visual-review]
  pull_request:
  workflow_dispatch:
    inputs:
      review_visuals:
        description: Generate candidate visual baselines for human review
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check && npm test && npm run test:legacy
      - run: npx playwright install chromium
      - name: Generate candidate visual baselines
        if: inputs.review_visuals == true || github.ref == 'refs/heads/v1.3-visual-review'
        run: npx playwright test visual.spec.ts --project=iphone-390 --update-snapshots
      - run: npm run test:e2e
        if: inputs.review_visuals != true && github.ref != 'refs/heads/v1.3-visual-review'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-regression
          path: |
            test-results/
            playwright-report/
            e2e/*-snapshots/
          retention-days: 7
